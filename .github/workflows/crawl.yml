name: Crawl Platform Data

on:
  schedule:
    # 每天北京时间早上8点运行 (UTC 0:00 = Beijing 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 允许 bot 提交并推送 data.js
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run crawler
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          KS_COOKIE: ${{ secrets.KS_COOKIE }}
          TT_COOKIE: ${{ secrets.TT_COOKIE }}
        run: node scripts/crawl.mjs

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "chore: auto-update platform data [skip ci]"
          git push
