<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Station — All Platforms Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Animated background layers -->
<div class="bg-illustration">
  <!-- Mesh gradient orbs -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
  <div class="orb orb--4"></div>

  <!-- Grid pattern -->
  <svg class="grid-pattern" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </svg>

  <!-- Floating geometric shapes -->
  <div class="shape shape--ring">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="80" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="8 12"/>
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="shape shape--triangle">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,10 90,85 10,85" fill="none" stroke="rgba(99,102,241,0.15)" stroke-width="1.5"/>
    </svg>
  </div>

  <div class="shape shape--cross">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="5" x2="30" y2="55" stroke="rgba(168,85,247,0.12)" stroke-width="1.5"/>
      <line x1="5" y1="30" x2="55" y2="30" stroke="rgba(168,85,247,0.12)" stroke-width="1.5"/>
    </svg>
  </div>

  <div class="shape shape--dots">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="2" fill="rgba(99,102,241,0.2)"/>
      <circle cx="60" cy="20" r="2" fill="rgba(99,102,241,0.2)"/>
      <circle cx="100" cy="20" r="2" fill="rgba(99,102,241,0.2)"/>
      <circle cx="20" cy="60" r="2" fill="rgba(99,102,241,0.15)"/>
      <circle cx="60" cy="60" r="2" fill="rgba(99,102,241,0.2)"/>
      <circle cx="100" cy="60" r="2" fill="rgba(99,102,241,0.15)"/>
      <circle cx="20" cy="100" r="2" fill="rgba(99,102,241,0.1)"/>
      <circle cx="60" cy="100" r="2" fill="rgba(99,102,241,0.15)"/>
      <circle cx="100" cy="100" r="2" fill="rgba(99,102,241,0.1)"/>
    </svg>
  </div>

  <!-- Flowing wave lines -->
  <svg class="wave-lines" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <defs>
      <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
        <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path class="wave wave--1" d="M0,100 C200,50 400,150 600,100 C800,50 1000,150 1200,100 C1400,50 1600,150 1800,100" fill="none" stroke="url(#waveGrad1)" stroke-width="1.5"/>
    <path class="wave wave--2" d="M0,200 C300,120 500,280 800,200 C1100,120 1300,280 1600,200" fill="none" stroke="url(#waveGrad1)" stroke-width="1" opacity="0.5"/>
    <path class="wave wave--3" d="M0,300 C250,380 450,220 700,300 C950,380 1150,220 1400,300 C1650,380 1900,220 2000,300" fill="none" stroke="url(#waveGrad1)" stroke-width="1" opacity="0.3"/>
  </svg>

  <!-- Particles canvas -->
  <canvas class="particles-canvas" id="particlesCanvas"></canvas>
</div>

<!-- Mouse cursor glow -->
<div class="cursor-glow" id="cursorGlow"></div>

<main class="dashboard">
  <!-- Header tile - spans 2 columns, 2 rows -->
  <header class="tile tile--header">
    <div class="tile__glow"></div>
    <div class="header-content">
      <div class="header-eyebrow">
        <span class="pulse-dot"></span>
        LIVE DASHBOARD
      </div>
      <h1 class="header-title">
        Creator
        <span class="title-accent">Station</span>
      </h1>
      <p class="header-sub">8 platforms. One audience. Real-time performance overview.</p>
      <div class="header-meta">
        <span class="meta-item">Updated <b id="boardUpdated"></b></span>
      </div>
    </div>
    <!-- Decorative mini chart in header -->
    <div class="header-deco">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="headerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
            <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
          </linearGradient>
        </defs>
        <polyline points="0,60 20,55 40,62 60,45 80,50 100,35 120,40 140,25 160,30 180,15 200,20"
                  fill="none" stroke="url(#headerLineGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="200" cy="20" r="4" fill="#A855F7"/>
        <circle cx="200" cy="20" r="8" fill="#A855F7" opacity="0.3"/>
      </svg>
    </div>
  </header>

  <!-- Total followers - large stat -->
  <section class="tile tile--stat tile--stat-lg">
    <div class="tile__glow"></div>
    <div class="stat-eyebrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      TOTAL FOLLOWERS
    </div>
    <div class="stat-value" id="totalFollowers">0</div>
    <div class="stat-trend stat-trend--up">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>
      </svg>
      +12.4% this month
    </div>
    <div class="stat-spark" id="followersChart"></div>
  </section>

  <!-- Total views -->
  <section class="tile tile--stat tile--stat-sm">
    <div class="tile__glow"></div>
    <div class="stat-eyebrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      TOTAL VIEWS
    </div>
    <div class="stat-value" id="totalViews">0</div>
    <div class="stat-trend stat-trend--up">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>
      </svg>
      +8.7% this month
    </div>
  </section>

  <!-- Platforms count -->
  <section class="tile tile--stat tile--stat-sm tile--stat-accent">
    <div class="tile__glow"></div>
    <div class="stat-eyebrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      ACTIVE PLATFORMS
    </div>
    <div class="stat-value stat-value--mono">8</div>
    <div class="stat-sub">Global reach across networks</div>
  </section>

  <!-- Platform cards grid -->
  <section class="platform-board" id="platformBoard"></section>

  <!-- Footer CTA tile -->
  <section class="tile tile--cta">
    <div class="tile__glow"></div>
    <div class="cta-content">
      <h3 class="cta-title">Explore the Content</h3>
      <p class="cta-sub">Click any platform card above to visit the channel directly.</p>
    </div>
    <div class="cta-deco">
      <div class="cta-pulse"></div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
